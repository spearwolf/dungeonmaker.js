name: ci
on:
  push:
  pull_request:
  workflow_call: # release.yml runs the full suite before publishing
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - run: pnpm check:package
      - run: pnpm pack:smoke
      - run: pnpm compliance

  # Native reference build (GCC and clang) must hit the same golden hashes as the wasm.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh native/test/run.sh
        env:
          CXX: g++
          CXX_ALT: clang++
          DM_REQUIRE_CXX_ALT: "1"

  # The committed wasm must be exactly what native/ builds (bit-reproducible, spec §8.1).
  wasm-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh native/build.sh
      - run: git diff --exit-code -- packages/dungeonmaker-js/wasm

  # Client tests in real browsers: Web Worker + wasm in Chromium, Firefox and WebKit.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter dungeonmaker-js test:browser

  # Vite and webpack consume the packed tarball without configuration, under a strict CSP.
  bundlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm bundler:smoke

  # The VitePress site builds against the local package; its browser checks run on the build.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm site:build
      - run: pnpm site:e2e

  # Required status check. always() keeps it from being skipped (a skipped required check
  # counts as passed) when a dependency fails.
  ci:
    if: always()
    needs: [check, native, wasm-drift, browser, bundlers, site]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
